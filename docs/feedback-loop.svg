<path d="M 94 395 L 98 350 Q 102 326 127 324 L 154 324 Q 182 328 186 354 L 190 395" fill="#BCD9E8" stroke="#192F3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 111 356 L 124 381 L 173 354" fill="none" stroke="#192F3B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="167" y="318" width="35" height="64" rx="6" fill="#192F3B"/>
