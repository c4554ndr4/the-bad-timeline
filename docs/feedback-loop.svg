<tspan x="564" dy="0">User preferences:</tspan>
</text>
<text x="564" y="810" font-size="24" font-weight="400" fill="#192F3B" text-anchor="start">
<tspan x="564" dy="0">Science and space.</tspan>
</text>
<text x="564" y="1030" font-size="20" font-weight="700" fill="#192F3B" text-anchor="start">
<tspan x="564" dy="0">Recent tweets to diversify from:</tspan>
</text>
<text x="564" y="1062" font-size="23" font-weight="400" fill="#5D6D75" text-anchor="start">
<tspan x="564" dy="0">[recent posts…]</tspan>
</text>
<text x="80" y="895" font-size="22" font-weight="400" fill="#5D6D75" text-anchor="start">
<tspan x="80" dy="0">No liked-post examples</tspan>
<tspan x="80" dy="31">have been added yet.</tspan>
</text>
<rect x="557" y="833" width="410" height="163" rx="10" fill="#D0E7F6"/>
<text x="580" y="864" font-size="21" font-weight="700" fill="#20567A" text-anchor="start">
<tspan x="580" dy="0">Tweets the user has liked:</tspan>
</text>
<text x="580" y="900" font-size="23" font-weight="400" fill="#192F3B" text-anchor="start">
<tspan x="580" dy="0">“Space is huge. My inbox</tspan>
<tspan x="580" dy="30">is bigger.”</tspan>
<tspan x="580" dy="30">“Mars has zero meetings.”</tspan>
</text>
