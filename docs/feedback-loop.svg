<text x="74" y="194" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="74" dy="0">1</tspan>
</text>
<text x="108" y="196" font-size="29" font-weight="700" fill="#192F3B" text-anchor="start">
<tspan x="108" dy="0">A person likes a few tweets</tspan>
</text>
