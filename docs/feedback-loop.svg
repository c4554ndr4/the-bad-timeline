<text x="144" y="430" font-size="21" font-weight="600" fill="#5D6D75" text-anchor="middle">
<tspan x="144" dy="0">The reader</tspan>
</text>
<rect x="260" y="225" width="350" height="224" rx="15" fill="#FFFFFF" stroke="#D8DFE0" stroke-width="1.5"/>
<circle cx="295" cy="259" r="14" fill="#B4CBDA"/>
<text x="320" y="266" font-size="18" font-weight="600" fill="#5D6D75" text-anchor="start">
<tspan x="320" dy="0">@orbital_notes</tspan>
</text>
<text x="284" y="312" font-size="25" font-weight="400" fill="#192F3B" text-anchor="start">
<tspan x="284" dy="0">Space is huge.</tspan>
<tspan x="284" dy="32">My inbox is bigger.</tspan>
</text>
<path d="M 284 400 H 586" fill="none" stroke="#D8DFE0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path transform="translate(284 414) scale(1.1)" d="M 12 21 C 9 18 1 12 1 7 C 1 1 8 -1 12 5 C 16 -1 23 1 23 7 C 23 12 15 18 12 21 Z" fill="#BD496D" stroke="#BD496D" stroke-width="1.8"/>
<text x="322" y="434" font-size="18" font-weight="600" fill="#BD496D" text-anchor="start">
