<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1640" viewBox="0 0 1040 1640" role="img" aria-labelledby="title desc">
<title id="title">How a like changes The Bad Timeline</title>
<desc id="desc">A person who prefers science and space likes two fictional humorous tweets. On the next generation request, the backend adds their text under Tweets the user has liked. Before and after prompt excerpts show that addition, while the stated preference and operator instructions remain. Groq generates a new batch with similar themes and style, displayed as posts from fictional authors. More reading and likes provide context for a later batch. Examples are illustrative, not an actual model run.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#317FB0"/></marker></defs>
<rect width="1040" height="1640" fill="#F8F6F1"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#192F3B">
<text x="56" y="42" font-size="18" font-weight="700" fill="#5D6D75" text-anchor="start">
<tspan x="56" dy="0">THE BAD TIMELINE</tspan>
</text>
<text x="56" y="93" font-size="43" font-weight="700" fill="#192F3B" text-anchor="start">
<tspan x="56" dy="0">How a like changes the timeline</tspan>
</text>
<text x="56" y="131" font-size="24" font-weight="400" fill="#5D6D75" text-anchor="start">
<tspan x="56" dy="0">A reader’s feedback becomes context for the next batch.</tspan>
</text>
