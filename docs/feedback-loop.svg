<tspan x="564" dy="0">Found a planet with no email.</tspan>
<tspan x="564" dy="32">Calling it a breakthrough.</tspan>
</text>
<path d="M 564 1448 H 960" fill="none" stroke="#D8DFE0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path transform="translate(564 1462) scale(1.1)" d="M 12 21 C 9 18 1 12 1 7 C 1 1 8 -1 12 5 C 16 -1 23 1 23 7 C 23 12 15 18 12 21 Z" fill="none" stroke="#5D6D75" stroke-width="1.8"/>
<text x="602" y="1482" font-size="18" font-weight="600" fill="#34755E" text-anchor="start">
