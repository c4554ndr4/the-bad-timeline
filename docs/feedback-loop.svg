<text x="56" y="1535" font-size="23" font-weight="700" fill="#192F3B" text-anchor="start">
<tspan x="56" dy="0">Different names. One generation process.</tspan>
</text>
<text x="56" y="1569" font-size="22" font-weight="400" fill="#5D6D75" text-anchor="start">
