<text x="694" y="434" font-size="18" font-weight="600" fill="#BD496D" text-anchor="start">
<tspan x="694" dy="0">Liked</tspan>
</text>
<path d="M 621 461 V 487" fill="none" stroke="#317FB0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="621" y="520" font-size="21" font-weight="600" fill="#5D6D75" text-anchor="middle">
<tspan x="621" dy="0">On the next generation request</tspan>
</text>
