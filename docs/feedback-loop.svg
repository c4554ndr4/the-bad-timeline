<tspan x="74" dy="0">2</tspan>
</text>
<text x="108" y="577" font-size="29" font-weight="700" fill="#192F3B" text-anchor="start">
<tspan x="108" dy="0">The backend adds those likes to the prompt</tspan>
</text>
<rect x="56" y="604" width="928" height="73" rx="12" fill="#EDE8F1"/>
<text x="78" y="632" font-size="19" font-weight="700" fill="#655175" text-anchor="start">
<tspan x="78" dy="0">Operator instruction in both prompts (abridged)</tspan>
</text>
<text x="78" y="660" font-size="22" font-weight="400" fill="#473A56" text-anchor="start">
<tspan x="78" dy="0">Keep the reader engaged; subtly encourage good epistemics.</tspan>
</text>
<rect x="56" y="697" width="444" height="393" rx="15" fill="#F0F1EF" stroke="#D8DFE0" stroke-width="1.5"/>
